name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff
          pip install -e .

      - name: Ruff
        run: |
          ruff check src/services/heuristics.py src/services/country_vantage.py \
            src/services/frontier.py src/resources/frontier_output.py tests

      - name: Pytest
        run: pytest -q

  summary-on-failure:
    if: failure()
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Failure notice
        run: |
          echo "::error::CI failed — see lint-and-test job logs."
          echo "## CI failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the **lint-and-test** job for ruff or pytest errors." >> "$GITHUB_STEP_SUMMARY"
