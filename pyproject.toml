[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vless-checker"
version = "1.0.0"
description = "VLESS configuration checker using Xray"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27.0",
]

[project.scripts]
vless-checker = "src.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
